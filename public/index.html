<!doctype html>
<html>
<head><meta charset="utf-8"><title>Face - Gatekeeper</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:20px auto">
<h2>Face - Job Ticket Creator</h2>
<textarea id="t" rows="4" style="width:100%" placeholder="e.g. make me a gmail for my art business"></textarea><br><br>
<button onclick="send()">Submit</button>
<pre id="o"></pre>
<script>
async function send(){
  const text = document.getElementById('t').value;
  const r = await fetch('/job',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const j = await r.json();
  document.getElementById('o').textContent = JSON.stringify(j,null,2);
}
</script>
</body>
</html>
